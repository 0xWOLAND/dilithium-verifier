[workspace]
members = [
    "bit-operations-gadget",
    "keccak-permutation-gadget",
    "shake256-gadget",
    "ntt-gadget", 
    "mldsa-gadget",
]
resolver = "2"

[workspace.dependencies]
plonky2 = "0.2"
plonky2_field = "0.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha3 = "0.10"
hex = "0.4"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
rand = "0.8"
criterion = "0.5"
